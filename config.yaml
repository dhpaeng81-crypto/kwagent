# 한국 1개월 기상예측 에이전트 설정
# ---------------------------------------------------------------
# 단계 1: regions_active: [korea]
# 단계 2: regions_active: [korea, central, south]

regions_active: [korea]

# 평년(삼분위 기준) 기간 — 기상청과 동일하게 1991~2020
normal_period: [1991, 2020]
# 통계모델 학습 기간 (시작 연도 ~ 작년)
train_start_year: 1991

# 발표 요일: 3 = 목요일 (월=0)
issue_weekday: 3
# 예측 주 수 (발표 다음다음 주 월요일부터)
n_weeks: 4

variables:
  temp:   {label: "기온",   unit: "°C", agg: mean}
  cloud:  {label: "운량",   unit: "%",  agg: mean}
  srad:   {label: "일사량", unit: "MJ/m²", agg: mean}   # 하루 일사량(MJ/m²)의 주평균
  precip: {label: "강수량", unit: "mm", agg: sum}

# 강수일 기준(일강수량, mm)과 눈으로 볼 비율(강수 중 비가 아닌 비율)
wet_day_mm: 1.0
snow_fraction_threshold: 0.5

paths:
  cache: data/cache
  # ERA5 과거 자료(지점별 csv.gz) — 저장소에 커밋해 보관 (처음 받는 데 무료 한도로 몇 시간 걸림)
  era5: data/era5
  store: data/store.sqlite
  models: data/models
  reports: reports

sources:
  openmeteo:
    archive_url: https://archive-api.open-meteo.com/v1/archive
    seasonal_url: https://seasonal-api.open-meteo.com/v1/seasonal
    ensemble_url: https://ensemble-api.open-meteo.com/v1/ensemble
    # 모델 식별자는 Open-Meteo 문서에서 바뀔 수 있으니 확인 후 수정
    ec46_model: ecmwf_ec46
    gefs_model: ncep_gefs05
    timezone: Asia/Seoul
    request_pause_s: 1.0
    # ERA5 를 1년씩 나눠 받을 때 조각 사이 쉬는 시간(초) — 분당 한도 600회 대비
    archive_chunk_pause_s: 4.0
  indices:
    # 주간 Niño3.4 (OISST, CPC)
    nino34_url: https://www.cpc.ncep.noaa.gov/data/indices/wksst9120.for
    # 일별 북극진동(AO) 지수 (CPC)
    ao_url: https://ftp.cpc.ncep.noaa.gov/cwlinks/norm.daily.ao.index.b500101.current.ascii
    # MJO RMM 지수 (호주 기상청) — 2026-11 확인: 2024-02-24 이후 갱신 멈춤. 오래된 값은 자동으로 무시됨
    mjo_url: https://www.bom.gov.au/climate/mjo/graphics/rmm.74toRealtime.txt
  kma:
    # 기상청 API허브 키를 받으면 환경변수 KMA_API_KEY 로 설정 → ASOS 관측으로 정답 교체 가능
    enabled: false

# 예측원 결합 초기 가중치 (검증 기록이 쌓이면 RPSS 기반으로 자동 갱신)
combine:
  prior_weights:
    statistical: 0.35
    ec46: 0.45
    gefs: 0.20
  # 검증 기록이 이 개수 미만이면 prior 사용, 역학모델은 편향보정 전이라 가중치 축소
  min_verified: 8
  unverified_dyn_factor: 0.5
  # 기후값(1/3,1/3,1/3) 쪽으로 당기는 비율 — 주차별 (1~4주)
  shrink_to_climatology: [0.25, 0.35, 0.45, 0.50]
  # 표시 확률 하한 (기상청처럼 0%를 피함)
  min_prob: 0.05

narrative:
  enabled: true
  provider: anthropic
  model: claude-sonnet-5-5
  max_tokens: 1500
