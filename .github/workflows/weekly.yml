# 매주 목요일 07:10 KST: 지난 예측 채점 → 이번 주 예측 → 웹사이트 갱신 → GitHub Pages 배포
# 예측·검증 기록(data/store.sqlite, data/models, reports/)과 ERA5 과거 자료(data/era5)는 저장소에 커밋해 이어진다.
# (처음 ERA5 과거 자료를 나눠 받던 2시간 간격 실행은 다 받은 뒤 2026-11-24 에 뺐다. 자료를 다시 받아야 하면
#  수동 실행을 여러 번 하거나 cron "17 */2 * * *" 을 잠시 되살리면 된다 — 받는 동안은 예측·배포를 건너뜀.)
name: weekly-forecast

on:
  schedule:
    - cron: "10 22 * * 3"        # 수 22:10 UTC = 목 07:10 KST
    # GitHub 예약 실행은 몇 시간씩 늦거나 빠질 때가 있어 예비 시각을 둔다 (이미 이번 주 전망이 있으면 바로 끝남)
    - cron: "47 23 * * 3"        # 목 08:47 KST
    - cron: "13 3 * * 4"         # 목 12:13 KST
  workflow_dispatch:
    inputs:
      issue:
        description: "발표일 (YYYY-MM-DD, 비우면 최근 목요일)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kwagent
  cancel-in-progress: false

env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: "1"
  SITE_TOKEN: ${{ secrets.SITE_TOKEN }}   # 있으면 공개 저장소로 사이트만 게시, 없으면 이 저장소 Pages

jobs:
  forecast:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pub.outputs.pages }}
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 앞 실행이 커밋한 최신 기록(store·era5)부터 시작 (대기 중 밀린 실행 대비)

      - name: 할 일 판단
        id: mode
        run: |
          thu=$(date -d "$(date +%F) -$(( ($(date +%u) + 3) % 7 )) days" +%F)   # 이번 주(KST) 목요일
          if [ "${{ github.event.schedule }}" = "17 */2 * * *" ] && [ -f data/models/statistical_korea.joblib ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "이미 준비 완료 — 이번 2시간 실행은 건너뜀"
          elif [ -n "${{ github.event.schedule }}" ] && [ -f "reports/forecast_${thu}.json" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "이번 주(${thu}) 전망은 이미 있음 — 예비 실행은 건너뜀"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.mode.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 글꼴
        if: steps.mode.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum && rm -rf ~/.cache/matplotlib

      - name: 설치
        if: steps.mode.outputs.skip != 'true'
        run: pip install -e ".[llm]"

      - name: ERA5·지수 캐시 복원
        if: steps.mode.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: data/cache
          key: kwagent-cache-${{ github.run_id }}
          restore-keys: kwagent-cache-

      - name: ERA5 과거 자료 받기 (처음엔 여러 번에 나눠 받음)
        id: backfill
        if: steps.mode.outputs.skip != 'true'
        env:
          KWAGENT_BACKFILL_MINUTES: "105"   # 한 번에 최대 105분 받고 저장 (나머지는 다음 실행)
        run: kwagent backfill

      - name: 최초 1회 학습 (모델이 없을 때만)
        if: steps.backfill.outputs.complete == 'true'
        run: |   # 권역 중 하나라도 모델이 없으면 학습 (권역을 늘렸을 때)
          python -c "from kwagent.config import load_config as L; c=L('config.yaml'); import sys; sys.exit(0 if all((c.path('models')/f'statistical_{r}.joblib').exists() for r in c.regions) else 1)" || kwagent train

      - name: 검증 + 예측
        if: steps.backfill.outputs.complete == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.issue }}" ]; then
            kwagent verify && kwagent forecast --issue "${{ inputs.issue }}"
          else
            kwagent run
          fi

      - name: 웹사이트 생성
        if: steps.backfill.outputs.complete == 'true'
        run: kwagent site

      - name: 기록 커밋 (실패해도 받은 자료는 저장)
        if: always() && steps.mode.outputs.skip != 'true'
        run: |
          git config user.name  "kwagent-bot"
          git config user.email "kwagent-bot@users.noreply.github.com"
          for f in data/era5 data/store.sqlite data/models reports; do if [ -e "$f" ]; then git add "$f"; fi; done
          if [ "${{ steps.backfill.outputs.complete }}" = "true" ]; then msg="forecast $(date +%F)"; else msg="ERA5 자료 이어 받기 $(date +%F' '%H:%M)"; fi
          git commit -m "$msg" || echo "변경 없음"
          git pull --rebase --autostash origin main || { git rebase --abort; echo '::error::기록 충돌 — 다른 실행이 먼저 커밋함'; exit 1; }
          git push

      - name: 게시 방식
        id: pub
        if: steps.backfill.outputs.complete == 'true'
        run: if [ -z "$SITE_TOKEN" ]; then echo "pages=true" >> "$GITHUB_OUTPUT"; fi

      - name: 공개 저장소로 사이트만 게시
        if: steps.backfill.outputs.complete == 'true' && env.SITE_TOKEN != ''
        run: bash deploy/publish_site.sh

      - uses: actions/configure-pages@v5
        if: steps.backfill.outputs.complete == 'true' && env.SITE_TOKEN == ''
      - uses: actions/upload-pages-artifact@v3
        if: steps.backfill.outputs.complete == 'true' && env.SITE_TOKEN == ''
        with:
          path: site

  # 배포는 별도 작업(GitHub 권장 방식): 같은 작업에서 올리자마자 배포하면 'artifact 0개' 오류가 남
  deploy:
    needs: forecast
    if: needs.forecast.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
