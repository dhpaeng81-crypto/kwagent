# 분기마다(1·4·7·10월 1일) 통계모델 재학습. 수동 실행도 가능(Actions 탭 → train → Run workflow).
name: train

on:
  schedule:
    - cron: "30 18 1 1,4,7,10 *"   # 해당 월 1일 03:30 KST 무렵(UTC 18:30, 전날)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kwagent
  cancel-in-progress: false

env:
  TZ: Asia/Seoul

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # 앞 실행이 커밋한 최신 기록(store·era5)부터 시작 (대기 중 밀린 실행 대비)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: kwagent-cache-${{ github.run_id }}
          restore-keys: kwagent-cache-
      - run: kwagent backfill
      - run: kwagent train
      - name: 모델 커밋
        run: |
          git config user.name  "kwagent-bot"
          git config user.email "kwagent-bot@users.noreply.github.com"
          git add data/era5 data/models reports/train_report.csv
          git commit -m "retrain $(date +%F)" || echo "변경 없음"
          git push
