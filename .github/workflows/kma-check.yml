# 기상청 1개월전망 자료 출처 확인용 (수동 실행). 받은 내용을 로그에 찍기만 하고 아무것도 저장·배포하지 않는다.
name: kma-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 도구
        run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
      - name: 기상청 주소 시험
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) kwagent-check"
          try() {
            echo "=================== $1"
            curl -sS -L -m 40 -A "$UA" -o out.bin -D hdr.txt -w "HTTP %{http_code} | %{content_type} | %{size_download} bytes | %{url_effective}\n" "$1" || echo "curl 실패"
            grep -i -E "^(content-type|content-disposition|location):" hdr.txt | head -5
            if file out.bin | grep -qi pdf; then
              pdftotext -layout out.bin out.txt && echo "--- PDF 본문 앞부분" && head -c 6000 out.txt
            else
              echo "--- 본문 앞부분(태그 제거)" && sed -e 's/<[^>]*>/ /g' out.bin | tr -s ' \t' ' ' | grep -v '^\s*$' | head -c 4000
              echo; echo "--- 링크 중 pdf/1month/fct_mon"; grep -o -i -E "(href|src)=\"[^\"]*(pdf|1month|fct_mon|long)[^\"]*\"" out.bin | sort -u | head -40
            fi
            echo
          }
          # 권역별 PDF 번호 찾기: 전국 108 외에 지역 번호를 시험 (있으면 제목·첫 주 확률만 출력)
          for c in 108 109 105 101 131 133 146 156 143 159 184 11B 11D 11C 11F 11H 11G 10 20 30 40 50 60 70 80 90; do
            u="https://www.weather.go.kr/w/repositary/xml/fct/mon/fct_mon1_${c}_20261119.pdf"
            code=$(curl -s -L -m 30 -A "$UA" -o r.bin -w "%{http_code}|%{content_type}" "$u")
            if file r.bin | grep -qi pdf; then
              pdftotext -layout r.bin r.txt
              echo "== $c PDF: $(grep -m1 -E '전망|예보' r.txt | tr -s ' ') / $(grep -m3 '확률전망' r.txt | tr -s ' ' | tr '\n' ';')"
              grep -m6 -E '(서울|인천|경기|강원|충청|충북|충남|대전|세종|전라|전북|전남|광주|경상|경북|경남|부산|대구|울산|제주)' r.txt | tr -s ' ' | head -6
            else
              echo "-- $c 없음 ($code)"
            fi
          done
          # 지난 발표분이 다른 이름으로 남아 있는지
          for u in "https://www.weather.go.kr/w/repositary/xml/fct/mon/fct_mon1_108_20261112.pdf" \
                   "https://www.weather.go.kr/w/repositary/xml/fct/mon/fct_mon1_108.pdf"; do
            echo "== $u -> $(curl -s -L -m 30 -A "$UA" -o r.bin -w '%{http_code}|%{content_type}|%{size_download}' "$u")"
          done
          # 기상청 API허브의 AI용 안내(장기예보 API 여부)
          curl -s -m 30 -A "$UA" https://apihub.kma.go.kr/llms.txt | grep -n -i -E "장기|1개월|월간|long|mon" | head -30
          curl -s -m 60 -A "$UA" https://apihub.kma.go.kr/specs/openapi.yml | grep -n -i -E "장기|1개월|월간|longterm|fct_mon|mon1" | head -30
